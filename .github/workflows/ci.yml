# Runs on every pull request and on pushes to main. A PR should be green before it is merged.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Ruff lint
        run: uv run --locked ruff check .
      - name: Ruff format
        run: uv run --locked ruff format --check .

  test:
    name: Test & build (${{ matrix.os }})
    # Windows is the main dev machine; Ubuntu matches the WSL fallback.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install (fails if uv.lock is out of date)
        run: uv sync --locked
      - name: Tests (includes the PLAN.md consistency check)
        run: uv run --locked pytest -v
      - name: Build package
        run: uv build
      - name: CLI smoke test
        run: uv run --locked tabmaker
